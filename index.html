const $=id=>document.getElementById(id);
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const tiles=$("tiles");

  tiles.insertAdjacentHTML("beforeend",`<input type="radio" name="rw" id="r${i}" value="${i}"><label for="r${i}">${r}</label>`);
});
function normName(s){
  return s.replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
    .replace(/ؤ/g,"و").replace(/ئ/g,"ي").replace(/چ/g,"ج").replace(/ک/g,"ك").replace(/ی/g,"ي").replace(/\s+/g," ").trim();
}
function normDigits(s){
  return s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776);
}
const unhex=x=>Uint8Array.from(x.match(/../g),b=>parseInt(b,16));
async function dec(a,blob){
  try{
    const b=unhex(blob),k=await crypto.subtle.importKey("raw",unhex(a),"AES-GCM",false,["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(0,12)},k,b.slice(12)));
  }catch(e){return null}
}
async function h(text){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(text),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode(DATA.salt),iterations:DATA.iter},key,192);
  const x=[...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
  return{k:x.slice(0,16),a:x.slice(16)};
}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function note(title,body){const n=el("div","note");n.append(el("strong","",title),el("span","",body));return n}
function timeBlock(){const d=el("div","time");d.append(el("small","","وقت الاختبار"),el("strong","","من الساعة 2:00 ظهرًا إلى 5:00 مساءً"));return d}
function dateParts(s){const m=s.match(/^(\S+)\s+(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)/);return m?{day:m[1],d:m[2],mo:MONTHS[+m[3]-1],y:m[4]}:null}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const out=$("out"),btn=$("go");out.replaceChildren();
  const raw=$("q").value.trim(),sel=document.querySelector('input[name=rw]:checked').value,ci=sel==="all"?-1:+sel;
  const digits=normDigits(raw).replace(/[\s\-]/g,"");
  const isId=/^\d+$/.test(digits);
  let key,shown;
  if(isId){
    if(digits.length!==14){out.append(note("الرقم القومي غير مكتمل","يتكون الرقم القومي من 14 رقمًا، والمُدخل "+digits.length+"."));return}
    key=await h("id:"+digits);shown=null;
  }else{
    const nm=normName(raw);
    if(nm.split(" ").length<3){out.append(note("اكتب الاسم كاملًا","أدخل الاسم الثلاثي أو الرباعي كما في بطاقة الرقم القومي، أو ابحث بالرقم القومي."));return}
    key=null;shown=raw.replace(/\s+/g," ");

  btn.disabled=true;

    const idx=ci<0?DATA.rw.map((_,i)=>i).filter(i=>find(i)):(find(ci)?[ci]:[]);
    let other=null;
    if(!idx.length&&ci>=0){for(let i=0;i<DATA.rw.length;i++){if(i!==ci&&find(i)){other=i;break}}}

        else t.append(el("p","day",DATA.dates[hit[0][0]]));
        t.append(timeBlock());
        if(hit.length>1)t.append(el("p","other","يوجد أكثر من تسجيل بنفس البيانات في هذا الرواق، تواصل مع الإدارة للتأكد."));

      const o=DATA.d[other][key.k],p=dateParts(DATA.dates[o[0][0]]);

    }else{
      out.append(note("لا توجد نتيجة",(isId?"تأكد من الرقم القومي":"تأكد من كتابة الاسم كاملًا كما في بطاقة الرقم القومي، أو ابحث بالرقم القومي")+(ci>=0?" واختيار الرواق الصحيح.":".")));
